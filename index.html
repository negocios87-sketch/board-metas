<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Atingimento de Meta · Board Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #fff;
    color: #111;
    min-height: 100vh;
    padding: 2.5rem 2rem 4rem;
    font-size: 14px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.75rem;
    padding-bottom: 1.25rem;
    border-bottom: 2px solid #111;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-right: 2px;
  }

  .filter-btn {
    padding: 5px 14px;
    border-radius: 3px;
    border: 1px solid #ddd;
    background: #fff;
    color: #555;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    transition: all .1s;
  }

  .filter-btn:hover { border-color: #999; color: #111; }

  .filter-btn.active {
    background: #111;
    border-color: #111;
    color: #fff;
  }

  .count {
    font-size: 12px;
    color: #999;
    margin-left: 6px;
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    padding: 9px 12px;
    text-align: center;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #555;
    border-bottom: 1px solid #e0e0e0;
    background: #fafafa;
    white-space: nowrap;
  }

  th.col-pessoa {
    text-align: left;
    min-width: 200px;
    padding-left: 0;
  }

  th.col-status {
    min-width: 80px;
  }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
    text-align: center;
  }

  td.col-pessoa {
    text-align: left;
    padding-left: 0;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  .person {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid #e8e8e8;
  }

  .av-init {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #f0f0f0;
    border: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #888;
    flex-shrink: 0;
  }

  .nome {
    font-weight: 500;
    color: #111;
    font-size: 13px;
    white-space: nowrap;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
  }

  .b-ativo   { background: #f0f0f0; color: #333; }
  .b-inativo { background: #f9f9f9; color: #aaa; }

  .val {
    font-size: 12px;
    font-weight: 500;
  }

  .hit  { color: #16a34a; }
  .miss { color: #dc2626; }
  .empty { color: #ccc; }

  .loading {
    padding: 4rem;
    text-align: center;
    color: #999;
    font-size: 13px;
  }

  .spinner {
    width: 22px;
    height: 22px;
    border: 2px solid #eee;
    border-top-color: #111;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div>
    <h1>Histórico de Atingimento de Meta</h1>
    <p>Board Academy</p>
  </div>
  <div class="controls" id="controls"></div>
</header>

<div id="root">
  <div class="loading">
    <div class="spinner"></div>
    Carregando...
  </div>
</div>

<script>
const HIST  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvwO3Ag2f2cbkVgR1pJZp6fANQcbualGKlAG50fmOljuEGKZ1gJBbSAjRdO3SomXUEVQOWnTvlfHRd/pub?gid=1955044016&single=true&output=csv';
const COLAB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvwO3Ag2f2cbkVgR1pJZp6fANQcbualGKlAG50fmOljuEGKZ1gJBbSAjRdO3SomXUEVQOWnTvlfHRd/pub?gid=1782440078&single=true&output=csv';

let filter = 'todos', people = [], months = [];

const fetchCSV = url =>
  fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(t => Papa.parse(t, { header: true, skipEmptyLines: true }).data);

function initials(n) {
  if (!n) return '?';
  const p = n.trim().split(/\s+/);
  return p.length >= 2 ? (p[0][0] + p[p.length-1][0]).toUpperCase() : p[0].slice(0,2).toUpperCase();
}

// Retorna { display, cls } — só texto, cor pela %
function parseCell(v) {
  if (!v || !v.trim() || v.trim() === '-') return { display: '—', cls: 'empty' };
  const raw = v.trim();
  const num = parseFloat(raw.replace('%','').replace(',','.'));
  if (!isNaN(num)) {
    const display = Number.isInteger(num) ? num + '%' : num.toFixed(1) + '%';
    return { display, cls: num >= 60 ? 'hit' : 'miss' };
  }
  // valores textuais: sim/não
  const c = raw.toLowerCase();
  if (/^(sim|s|atingiu|✓|ok|x)$/.test(c)) return { display: raw, cls: 'hit' };
  if (/^(não|nao|n|não atingiu)$/.test(c)) return { display: raw, cls: 'miss' };
  return { display: raw, cls: 'empty' };
}

function renderControls() {
  document.getElementById('controls').innerHTML = `
    <span class="filter-label">Status</span>
    ${['todos','ativo','inativo'].map(f => `
      <button class="filter-btn ${filter===f?'active':''}" onclick="setFilter('${f}')">
        ${f.charAt(0).toUpperCase()+f.slice(1)}
      </button>`).join('')}
    <span class="count" id="count"></span>`;
}

function render() {
  renderControls();
  const list = filter === 'todos' ? people : people.filter(p => filter === 'ativo' ? p.ativo : !p.ativo);
  const el = document.getElementById('count');
  if (el) el.textContent = list.length + ' pessoa' + (list.length !== 1 ? 's' : '');

  document.getElementById('root').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-pessoa">Colaborador</th>
            <th class="col-status">Status</th>
            ${months.map(m => `<th>${m}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${list.map(p => {
            return `<tr>
              <td class="col-pessoa">
                <div class="person">
                  ${p.foto
                    ? `<img class="avatar" src="${p.foto}" alt="${p.nome}" onerror="this.outerHTML='<div class=\\"av-init\\">${initials(p.nome)}</div>'">`
                    : `<div class="av-init">${initials(p.nome)}</div>`}
                  <span class="nome">${p.nome}</span>
                </div>
              </td>
              <td><span class="badge ${p.ativo?'b-ativo':'b-inativo'}">${p.ativo?'Ativo':'Inativo'}</span></td>
              ${months.map(m => {
                const { display, cls } = parseCell(p.hist[m]);
                return `<td><span class="val ${cls}">${display}</span></td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

window.setFilter = f => { filter = f; render(); };

Promise.all([fetchCSV(HIST), fetchCSV(COLAB)]).then(([hd, cd]) => {
  const hk = Object.keys(hd[0] || {}), ck = Object.keys(cd[0] || {});
  const hName = hk.find(k => /nome|name|colaborador|vendedor|pessoa|sdr|closer|consultor/i.test(k)) || hk[0];
  const cName = ck.find(k => /nome|name|colaborador|vendedor|pessoa|sdr|closer|consultor/i.test(k)) || ck[0];
  const fotoCol   = ck.find(k => /foto|photo|avatar|imagem|image|url|link/i.test(k));
  const statusCol = ck.find(k => /^status$|^ativo$|situaç|situac/i.test(k));

  months = hk.filter(k => k !== hName && k.trim());

  const hMap = {};
  hd.forEach(r => {
    const n = (r[hName] || '').trim();
    if (n) { hMap[n] = {}; months.forEach(m => { hMap[n][m] = r[m] || ''; }); }
  });

  const cMap = {};
  cd.forEach(r => { const n = (r[cName] || '').trim(); if (n) cMap[n] = r; });

  const lastM = months[months.length - 1];
  const allNames = new Set([...Object.keys(hMap), ...Object.keys(cMap)]);

  people = [...allNames].filter(n => n).map(nome => {
    const co = cMap[nome] || {}, hist = hMap[nome] || {};
    let ativo;
    if (statusCol && co[statusCol] !== undefined) {
      ativo = /^(ativo|sim|s|1|true|active|yes)$/.test((co[statusCol]||'').trim().toLowerCase());
    } else {
      ativo = (hist[lastM]||'').trim() !== '' && (hist[lastM]||'').trim() !== '-';
    }
    const foto = fotoCol ? (co[fotoCol]||'').trim() : '';
    return { nome, foto: foto || null, ativo, hist };
  });

  people.sort((a, b) => {
    if (a.ativo !== b.ativo) return a.ativo ? -1 : 1;
    return a.nome.localeCompare(b.nome, 'pt-BR');
  });

  render();
}).catch(e => {
  document.getElementById('root').innerHTML =
    `<div class="loading" style="color:#dc2626">⚠ Erro ao carregar: ${e.message}</div>`;
});
</script>
</body>
</html>
