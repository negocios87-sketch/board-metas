<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Atingimento de Meta · Board Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #fff;
    color: #111;
    min-height: 100vh;
    padding: 2.5rem 2rem 4rem;
    font-size: 13px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.75rem;
    padding-bottom: 1.25rem;
    border-bottom: 2px solid #111;
  }

  h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
  header p { font-size: 12px; color: #777; margin-top: 3px; }

  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-right: 2px;
  }

  .filter-btn {
    padding: 5px 13px;
    border-radius: 3px;
    border: 1px solid #ddd;
    background: #fff;
    color: #555;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    transition: all .1s;
  }

  .filter-btn:hover { border-color: #aaa; color: #111; }
  .filter-btn.active { background: #111; border-color: #111; color: #fff; }

  .count { font-size: 12px; color: #bbb; margin-left: 4px; }

  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }

  /* cabeçalho */
  thead tr:first-child th {
    background: #f5f5f5;
    border-bottom: 1px solid #e0e0e0;
    padding: 8px 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #666;
    white-space: nowrap;
  }

  th.col-nome { text-align: left; min-width: 160px; }
  th.col-cargo { text-align: left; min-width: 130px; }
  th.col-equipe { text-align: left; min-width: 110px; }
  th.col-status { text-align: center; min-width: 70px; }
  th.col-mes { text-align: center; min-width: 64px; }

  /* células */
  td {
    padding: 9px 10px;
    border-bottom: 1px solid #f2f2f2;
    vertical-align: middle;
    text-align: center;
    color: #333;
  }

  td.col-nome  { text-align: left; font-weight: 500; color: #111; white-space: nowrap; }
  td.col-cargo { text-align: left; color: #555; white-space: nowrap; }
  td.col-equipe{ text-align: left; color: #777; white-space: nowrap; }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  /* separador visual a cada grupo de 3 meses — via JS */
  td.sep, th.sep { border-left: 1px solid #e8e8e8; }

  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .b-ativo   { background: #f0f0f0; color: #444; }
  .b-inativo { background: #fafafa; color: #bbb; }

  /* valores — só cor do texto */
  .hit   { color: #16a34a; font-weight: 500; }
  .miss  { color: #dc2626; font-weight: 500; }
  .empty { color: #ccc; }

  .loading {
    padding: 4rem;
    text-align: center;
    color: #aaa;
    font-size: 13px;
    line-height: 2.5;
  }

  .spinner {
    width: 22px; height: 22px;
    border: 2px solid #eee; border-top-color: #333;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div>
    <h1>Histórico de Atingimento de Meta</h1>
    <p>Board Academy</p>
  </div>
  <div class="controls" id="controls"></div>
</header>

<div id="root">
  <div class="loading"><div class="spinner"></div>Carregando...</div>
</div>

<script>
const URL_HIST  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvwO3Ag2f2cbkVgR1pJZp6fANQcbualGKlAG50fmOljuEGKZ1gJBbSAjRdO3SomXUEVQOWnTvlfHRd/pub?gid=1955044016&single=true&output=csv';
const URL_COLAB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvwO3Ag2f2cbkVgR1pJZp6fANQcbualGKlAG50fmOljuEGKZ1gJBbSAjRdO3SomXUEVQOWnTvlfHRd/pub?gid=1782440078&single=true&output=csv';

const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

let activeFilter = 'todos';
let tableData = []; // [{nome, cargo, equipe, ativo, meses:{key:pct}}]
let monthCols = []; // [{key:'2025-06', label:'Jun/25'}]

const fetchCSV = url =>
  fetch(url)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(t => Papa.parse(t, { header: true, skipEmptyLines: true }).data);

// Encontra coluna por regex
const col = (keys, re) => keys.find(k => re.test(k.trim())) || null;

function pct(v) {
  if (!v && v !== 0) return null;
  const n = parseFloat(String(v).replace('%','').replace(',','.'));
  return isNaN(n) ? null : n;
}

function monthKey(ano, mes) {
  // mes pode ser número ou nome
  let m = parseInt(mes);
  if (isNaN(m)) {
    const idx = MESES_PT.findIndex(x => x.toLowerCase() === String(mes).trim().toLowerCase().slice(0,3));
    m = idx >= 0 ? idx + 1 : null;
  }
  if (!m) return null;
  const a = parseInt(ano);
  if (!a) return null;
  return `${a}-${String(m).padStart(2,'0')}`;
}

function monthLabel(key) {
  const [a, m] = key.split('-');
  return MESES_PT[parseInt(m)-1] + '/' + String(a).slice(2);
}

function cellVal(p, n) {
  if (p === null) return { display: '—', cls: 'empty' };
  const display = Number.isInteger(p) ? p + '%' : p.toFixed(1).replace('.',',') + '%';
  return { display, cls: p >= 60 ? 'hit' : 'miss' };
}

function renderControls() {
  document.getElementById('controls').innerHTML = `
    <span class="filter-label">Status</span>
    ${['todos','ativo','inativo'].map(f =>
      `<button class="filter-btn ${activeFilter===f?'active':''}" onclick="setFilter('${f}')">
        ${f === 'todos' ? 'Todos' : f === 'ativo' ? 'Ativo' : 'Inativo'}
      </button>`
    ).join('')}
    <span class="count" id="cnt"></span>`;
}

function render() {
  renderControls();
  const list = activeFilter === 'todos' ? tableData
    : tableData.filter(p => activeFilter === 'ativo' ? p.ativo : !p.ativo);

  const el = document.getElementById('cnt');
  if (el) el.textContent = list.length + ' pessoa' + (list.length !== 1 ? 's' : '');

  document.getElementById('root').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-nome">Nome</th>
            <th class="col-cargo">Cargo / Nível</th>
            <th class="col-equipe">Equipe</th>
            <th class="col-status">Status</th>
            ${monthCols.map((m, i) =>
              `<th class="col-mes${i%3===0?' sep':''}">${m.label}</th>`
            ).join('')}
          </tr>
        </thead>
        <tbody>
          ${list.map(p => `
            <tr>
              <td class="col-nome">${p.nome}</td>
              <td class="col-cargo">${p.cargo || '—'}</td>
              <td class="col-equipe">${p.equipe || '—'}</td>
              <td><span class="badge ${p.ativo?'b-ativo':'b-inativo'}">${p.ativo?'Ativo':'Inativo'}</span></td>
              ${monthCols.map((m, i) => {
                const { display, cls } = cellVal(p.meses[m.key] ?? null);
                return `<td class="${i%3===0?'sep':''}"><span class="${cls}">${display}</span></td>`;
              }).join('')}
            </tr>`
          ).join('')}
        </tbody>
      </table>
    </div>`;
}

window.setFilter = f => { activeFilter = f; render(); };

Promise.all([fetchCSV(URL_HIST), fetchCSV(URL_COLAB)]).then(([hist, colab]) => {

  // ── Detectar colunas do histórico ──
  const hk = Object.keys(hist[0] || {});
  const cAno  = col(hk, /^ano$/i)   || hk[0];
  const cMes  = col(hk, /^m[eê]s$/i) || hk[1];
  const cNome = col(hk, /nome|name|colaborador|vendedor|sdr|closer/i) || hk[2];
  const cNivel= col(hk, /n[íi]vel|cargo|fun[çc][ãa]o|role|posi[çc][ãa]o/i);
  const cPct  = col(hk, /ating|%|porcen|percent|result|meta/i) || hk[hk.length-1];

  // ── Detectar colunas dos colaboradores ──
  const ck = Object.keys(colab[0] || {});
  const ccNome   = col(ck, /nome|name|colaborador|vendedor|sdr|closer/i) || ck[0];
  const ccCargo  = col(ck, /cargo|n[íi]vel|fun[çc][ãa]o|role|posi[çc][ãa]o/i);
  const ccEquipe = col(ck, /equipe|time|squad|grupo|team/i);
  const ccStatus = col(ck, /^status$|^ativo$|situaç|situac/i);

  // Mapa de colaboradores
  const colabMap = {};
  colab.forEach(r => {
    const n = (r[ccNome] || '').trim();
    if (n) colabMap[n] = r;
  });

  // ── Pivotar histórico ──
  const pivot = {}; // nome -> { meses: {key: pct} }
  const monthSet = new Set();

  hist.forEach(r => {
    const nome = (r[cNome] || '').trim();
    const key  = monthKey(r[cAno], r[cMes]);
    const val  = pct(r[cPct]);
    if (!nome || !key) return;
    if (!pivot[nome]) pivot[nome] = { meses: {} };
    pivot[nome].meses[key] = val;
    // nível inline se existir
    if (cNivel && r[cNivel] && !pivot[nome].nivelInline) {
      pivot[nome].nivelInline = r[cNivel].trim();
    }
    monthSet.add(key);
  });

  // Ordenar meses
  monthCols = [...monthSet].sort().map(k => ({ key: k, label: monthLabel(k) }));

  // ── Montar tableData ──
  const allNames = new Set([...Object.keys(pivot), ...Object.keys(colabMap)]);
  const lastKey  = monthCols[monthCols.length - 1]?.key;

  tableData = [...allNames].filter(n => n).map(nome => {
    const co   = colabMap[nome] || {};
    const piv  = pivot[nome]   || { meses: {} };

    // status: coluna explícita > inferido pelo último mês
    let ativo;
    if (ccStatus && co[ccStatus] !== undefined) {
      ativo = /^(ativo|sim|s|1|true|active|yes)$/.test((co[ccStatus]||'').trim().toLowerCase());
    } else {
      ativo = lastKey ? (piv.meses[lastKey] !== undefined && piv.meses[lastKey] !== null) : false;
    }

    const cargo  = (ccCargo  ? co[ccCargo]  : null) || piv.nivelInline || '—';
    const equipe = (ccEquipe ? co[ccEquipe] : null) || '—';

    return { nome, cargo: cargo.trim(), equipe: equipe.trim(), ativo, meses: piv.meses };
  });

  tableData.sort((a, b) => {
    if (a.ativo !== b.ativo) return a.ativo ? -1 : 1;
    return a.nome.localeCompare(b.nome, 'pt-BR');
  });

  render();
}).catch(e => {
  document.getElementById('root').innerHTML =
    `<div class="loading" style="color:#dc2626">⚠ Erro: ${e.message}</div>`;
});
</script>
</body>
</html>
